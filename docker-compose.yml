# =============================================================================
# Taiphoon_Agent Docker Compose — 一容器一機部署
# =============================================================================
#
# 前置：先建構共用映像（只需一次）
#   docker build --target taiphoon-dev -t taiphoon-agent:dev .
#
# 實機部署（一台樹莓派 = 一個 agent）：
#   docker compose up -d fmu1_agent
#
# 本機多機測試（三台同時模擬）：
#   docker compose up -d
# =============================================================================

networks:
  taiphoon_net:
    name: Taiphoon_Net
    external: true

x-agent-defaults: &agent-defaults
  image: taiphoon-agent:dev
  user: taiphoon
  working_dir: /home/taiphoon/Taiphoon_Agent
  networks:
    - taiphoon_net
  stdin_open: true
  tty: true
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 8G
  volumes:
    - type: bind
      source: .
      target: /home/taiphoon/Taiphoon_Agent
    - type: bind
      source: ${SSH_AUTH_SOCK}
      target: ${SSH_AUTH_SOCK}

services:
  fmu1_agent:
    <<: *agent-defaults
    container_name: fmu1_agent
    hostname: fmu1-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=1
      - UXRCE_PORT=8888
      - AGENT_NAMESPACE=fmu1_agent

  fmu2_agent:
    <<: *agent-defaults
    container_name: fmu2_agent
    hostname: fmu2-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=2
      - UXRCE_PORT=8889
      - AGENT_NAMESPACE=fmu2_agent

  fmu3_agent:
    <<: *agent-defaults
    container_name: fmu3_agent
    hostname: fmu3-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=3
      - UXRCE_PORT=8890
      - AGENT_NAMESPACE=fmu3_agent
  fmu4_agent:
    <<: *agent-defaults
    container_name: fmu4_agent
    hostname: fmu4-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=4
      - UXRCE_PORT=8891
      - AGENT_NAMESPACE=fmu4_agent