      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=3
      - UXRCE_PORT=8890
      - AGENT_NAMESPACE=uav_3_agent
      - EGO_SWARM_PLANNER_BACKEND=${UAV_3_PLANNER_BACKEND:-optimized}
      - EGO_SWARM_ENABLE_GENERIC_TRAJECTORY_RESERVATION=${UAV_3_ENABLE_GENERIC_TRAJECTORY_RESERVATION:-false}
      - EGO_SWARM_PEER_PLANNING_MARGIN_M=${UAV_3_PEER_PLANNING_MARGIN_M:-1.0}
      - EGO_SWARM_OPTIMIZER_MAX_ITERATIONS=${UAV_3_OPTIMIZER_MAX_ITERATIONS:-40}
      - EGO_SWARM_OPTIMIZER_TIME_BUDGET_MS=${UAV_3_OPTIMIZER_TIME_BUDGET_MS:-70.0}
      - EGO_SWARM_FORMATION_CROSSING_PENALTY_M=${UAV_3_FORMATION_CROSSING_PENALTY_M:-10.0}
      - EGO_SWARM_RESERVATION_LEAD_TIME_S=${UAV_3_RESERVATION_LEAD_TIME_S:-0.0}
      - EGO_SWARM_RESERVATION_STEP_S=${UAV_3_RESERVATION_STEP_S:-0.5}
      - EGO_SWARM_RESERVATION_HORIZON_S=${UAV_3_RESERVATION_HORIZON_S:-5.0}
      - ENABLE_OBSTACLE_CLOUD_SIMULATOR=${UAV_3_ENABLE_OBSTACLE_CLOUD_SIMULATOR:-true}
      - OBSTACLE_CLOUD_MODE=${UAV_3_OBSTACLE_CLOUD_MODE:-explicit_empty}
      - OBSTACLE_CLOUD_CONFIG=${UAV_3_OBSTACLE_CLOUD_CONFIG:-/home/taiphoon/Taiphoon_Agent/config/obstacles/default.yaml}
  uav_4_agent:
    <<: *agent-defaults
    container_name: uav_4_agent
    hostname: uav-4-agent
