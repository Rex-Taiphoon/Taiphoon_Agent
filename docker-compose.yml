# =============================================================================
# Taiphoon_Agent Docker Compose — 一容器一機部署
# =============================================================================
#
# 前置：先建構共用映像（只需一次）
#   docker build --target taiphoon-dev -t taiphoon-agent:dev .
#
# 實機部署（一台樹莓派 = 一個 agent）：
#   docker compose up -d uav_1_agent
#
# 本機多機測試（四台同時模擬）：
#   docker compose up -d
#
# PointCloud2 障礙物模擬器可由每台 Agent 個別控制。預設不自動啟動，
# 以避免在實機沒有感測器時，誤以為空 PointCloud2 代表安全無障礙環境。
# 需要啟動時，透過 UAV_{N}_ENABLE_OBSTACLE_CLOUD_SIMULATOR=true 開啟。
# =============================================================================

networks:
  taiphoon_net:
    name: Taiphoon_Net
    external: true

x-agent-defaults: &agent-defaults
  image: taiphoon-agent:dev
  # 開發容器以 bind mount 的目前 entrypoint 為準，避免沿用 image 建置時
  # 可能已過期的 /home/taiphoon/entrypoint.sh。
  entrypoint:
    - /home/taiphoon/Taiphoon_Agent/docker/entrypoint.sh
  user: taiphoon
  working_dir: /home/taiphoon/Taiphoon_Agent
  networks:
    - taiphoon_net
  stdin_open: true
  tty: true
  # 遠端 shutdown 會終止容器 PID 1；禁止自動重啟，避免關閉後立即復活。
  # 若需要重新啟動 Agent，請由部署端再次執行 docker compose up -d。
  restart: "no"
  deploy:
    resources:
      limits:
        memory: 8G
  volumes:
    - type: bind
      source: .
      target: /home/taiphoon/Taiphoon_Agent
    - type: bind
      source: ${SSH_AUTH_SOCK}
      target: ${SSH_AUTH_SOCK}

services:
  uav_1_agent:
    <<: *agent-defaults
    container_name: uav_1_agent
    hostname: uav-1-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - BASH_ENV=/etc/profile.d/ros2.sh
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}
      - PX4_UROS_WS=/home/taiphoon/px4_ros_uxrce_dds_ws
      - TAIPHOON_WS=/home/taiphoon/Taiphoon_Agent
      - TARGET_SYSTEM=1
      - UXRCE_PORT=8888
      - AGENT_NAMESPACE=uav_1_agent
      - EGO_SWARM_PLANNER_BACKEND=${UAV_1_PLANNER_BACKEND:-optimized}
      - EGO_SWARM_ENABLE_GENERIC_TRAJECTORY_RESERVATION=${UAV_1_ENABLE_GENERIC_TRAJECTORY_RESERVATION:-false}
      - EGO_SWARM_PEER_PLANNING_MARGIN_M=${UAV_1_PEER_PLANNING_MARGIN_M:-1.0}
      - EGO_SWARM_OPTIMIZER_MAX_ITERATIONS=${UAV_1_OPTIMIZER_MAX_ITERATIONS:-40}
      - EGO_SWARM_OPTIMIZER_TIME_BUDGET_MS=${UAV_1_OPTIMIZER_TIME_BUDGET_MS:-70.0}
      - EGO_SWARM_FORMATION_CROSSING_PENALTY_M=${UAV_1_FORMATION_CROSSING_PENALTY_M:-10.0}
      - EGO_SWARM_RESERVATION_LEAD_TIME_S=${UAV_1_RESERVATION_LEAD_TIME_S:-0.0}
      - EGO_SWARM_RESERVATION_STEP_S=${UAV_1_RESERVATION_STEP_S:-0.5}
      - EGO_SWARM_RESERVATION_HORIZON_S=${UAV_1_RESERVATION_HORIZON_S:-5.0}
      - ENABLE_OBSTACLE_CLOUD_SIMULATOR=${UAV_1_ENABLE_OBSTACLE_CLOUD_SIMULATOR:-true}
      - OBSTACLE_CLOUD_MODE=${UAV_1_OBSTACLE_CLOUD_MODE:-explicit_empty}
      - OBSTACLE_CLOUD_CONFIG=${UAV_1_OBSTACLE_CLOUD_CONFIG:-/home/taiphoon/Taiphoon_Agent/config/obstacles/default.yaml}

  uav_2_agent:
    <<: *agent-defaults
    container_name: uav_2_agent
    hostname: uav-2-agent
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RCUTILS_COLORIZED_OUTPUT=1
