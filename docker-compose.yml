      - TARGET_SYSTEM=2
      - UXRCE_PORT=8889
      - AGENT_NAMESPACE=uav_2_agent
      - EGO_SWARM_PLANNER_BACKEND=${UAV_2_PLANNER_BACKEND:-optimized}
      - EGO_SWARM_ENABLE_GENERIC_TRAJECTORY_RESERVATION=${UAV_2_ENABLE_GENERIC_TRAJECTORY_RESERVATION:-false}
      - EGO_SWARM_PEER_PLANNING_MARGIN_M=${UAV_2_PEER_PLANNING_MARGIN_M:-1.0}
      - EGO_SWARM_OPTIMIZER_MAX_ITERATIONS=${UAV_2_OPTIMIZER_MAX_ITERATIONS:-40}
      - EGO_SWARM_OPTIMIZER_TIME_BUDGET_MS=${UAV_2_OPTIMIZER_TIME_BUDGET_MS:-70.0}
      - EGO_SWARM_FORMATION_CROSSING_PENALTY_M=${UAV_2_FORMATION_CROSSING_PENALTY_M:-10.0}
      - EGO_SWARM_RESERVATION_LEAD_TIME_S=${UAV_2_RESERVATION_LEAD_TIME_S:-0.0}
      - EGO_SWARM_RESERVATION_STEP_S=${UAV_2_RESERVATION_STEP_S:-0.5}
      - EGO_SWARM_RESERVATION_HORIZON_S=${UAV_2_RESERVATION_HORIZON_S:-5.0}
      - ENABLE_OBSTACLE_CLOUD_SIMULATOR=${UAV_2_ENABLE_OBSTACLE_CLOUD_SIMULATOR:-true}
      - OBSTACLE_CLOUD_MODE=${UAV_2_OBSTACLE_CLOUD_MODE:-explicit_empty}
      - OBSTACLE_CLOUD_CONFIG=${UAV_2_OBSTACLE_CLOUD_CONFIG:-/home/taiphoon/Taiphoon_Agent/config/obstacles/default.yaml}

  uav_3_agent:
    <<: *agent-defaults
    container_name: uav_3_agent
    hostname: uav-3-agent
