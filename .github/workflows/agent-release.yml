# @file agent-release.yml
# @brief 版本標籤通過共用建置驗證後，自動發布五個平台套件
# @author Taiphoon Agent Team
# @date 2026-10-02
name: Taiphoon Agent Release
on:
  push:
    tags: ['v*']
  # 手動重建必須在 "Use workflow from" 選擇版本標籤，workflow 與原始碼來自同一提交。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/agent-build.yml
    with:
      verification_only: false

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          path: release-source
      - name: 確認版本說明
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -s "release-source/docs/releases/$VERSION.md" ]; then
            echo "請先撰寫 docs/releases/$VERSION.md，列出本版變更、下載與驗證資訊。" >&2
            exit 1
          fi
      - name: 發布完整平台套件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 Tools/agent_launcher/release_transfer.py publish "$VERSION" \
            "release-source/docs/releases/$VERSION.md"
