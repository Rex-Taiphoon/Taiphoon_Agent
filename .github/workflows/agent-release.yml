# @file agent-release.yml
# @brief 版本標籤通過共用建置驗證後，自動發布五個平台套件
# @author Taiphoon Agent Team
# @date 2026-10-02
name: Taiphoon Agent Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/agent-build.yml
    with:
      verification_only: false

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - name: 發布完整平台套件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          下載符合平台的 taiphoon_agent 套件，解壓後直接開啟，或執行 taiphoon_agent start。
          樹莓派 Ubuntu 選 linux-arm64；Windows 選 windows-amd64；Mac 依晶片選 macos-arm64 或 macos-amd64。
          需要先安裝 Docker；首次啟動會引導設定並自動載入套件內的預編譯 Agent 映像。
          校驗由工具自動完成，不需要另下載校驗檔。啟動不會自動 Arm 或起飛。
          sim 可啟動 1～4 組 PX4＋Agent；deploy 啟動一台，Wi-Fi 飛控預設為 192.168.1.14。
          Docker Desktop 自動映射 UDP，不需要開啟 host networking；詳細操作見套件 README。
          樹莓派與 macOS 實機／DDS 驗收另由使用者完成。
          NOTES
          release_args=()
          if [[ "$VERSION" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$VERSION" release/* --verify-tag "${release_args[@]}" \
            --title "Taiphoon Agent $VERSION" --notes-file release-notes.md
