# @file agent-release.yml
# @brief 版本標籤通過共用建置驗證後，自動發布五個平台套件
# @author Taiphoon Agent Team
# @date 2026-10-02
name: Taiphoon Agent Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/agent-build.yml
    with:
      verification_only: false

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 確認版本說明
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -s "docs/releases/$VERSION.md" ]; then
            echo "請先撰寫 docs/releases/$VERSION.md，列出本版變更、下載與驗證資訊。" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - name: 發布完整平台套件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            printf '版本：`%s`\n' "$VERSION"
            printf '原始碼：[%s](https://github.com/%s/tree/%s)\n\n' \
              "${SOURCE_COMMIT:0:12}" "$GH_REPO" "$SOURCE_COMMIT"
            cat "docs/releases/$VERSION.md"
          } > release-notes.md
          release_args=()
          if [[ "$VERSION" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$VERSION" release/* --verify-tag "${release_args[@]}" \
            --title "Taiphoon Agent $VERSION" --notes-file release-notes.md
