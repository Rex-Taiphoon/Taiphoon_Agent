# @file agent-build.yml
# @brief CI 與 Release 共用的跨平台建置驗證
# @author Taiphoon Agent Team
# @date 2026-10-02
name: Taiphoon Agent Build
on:
  workflow_call:
    inputs:
      verification_only:
        description: 只建置與測試，不匯出大型映像或發布
        type: boolean
        default: false
      release_tag:
        description: 使用既有版本標籤的原始碼重建，不移動標籤
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.version.outputs.value }}
      source_commit:
        value: ${{ jobs.version.outputs.source_commit }}

# 繼承呼叫端權限：CI 為 read，只有 Release 呼叫端提供 contents write。

concurrency:
  group: agent-build-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Windows Python 的系統預設編碼可能不是 UTF-8；API 與繁體中文 log 統一處理。
  PYTHONUTF8: '1'
  # 打包只下載指定產物，不需要額外的 Docker build record artifact。
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  # 與目前已驗證的開發映像相同，不追蹤 px4_msgs 的浮動 main。
  PX4_MSGS_REF: 21556f8c9905e387da0fcfeb43e852332f20b807

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then REF_NAME="$REQUESTED_TAG"; REF_TYPE=tag; fi
          if [ "$VERIFICATION_ONLY" != true ] && [ "$REF_TYPE" != tag ]; then
            echo "請指定既有 release_tag；分支驗證請使用 CI workflow" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
              echo "Release tag 必須是 vX.Y.Z 或 vX.Y.Z-rc.N" >&2
              exit 1
            fi
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
            git fetch --depth 1 origin "refs/tags/$REF_NAME"
            echo "source_commit=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          else
            echo "value=v0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: 準備未公開的 Release 草稿
        if: ${{ !inputs.verification_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 Tools/agent_launcher/release_transfer.py create '${{ steps.version.outputs.value }}' '${{ steps.version.outputs.source_commit }}'

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: release-source
    env:
      VERSION: ${{ needs.version.outputs.value }}
      ARCHITECTURE: ${{ matrix.architecture }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          path: release-source
      - uses: docker/setup-buildx-action@v4
      - name: 建置開發映像
        uses: docker/build-push-action@v7
        with:
          context: release-source
          target: taiphoon-release-dev
          load: true
          tags: taiphoon-agent:${{ env.VERSION }}-dev-${{ matrix.architecture }}
          build-args: &agent-build-args |
            COLCON_SYMLINK_INSTALL=false
            PX4_MSGS_REF=${{ env.PX4_MSGS_REF }}
            BUILD_JOBS=2
            ROS_DEVELOPMENT_PACKAGE=ros-humble-ros-base
            COLCON_BUILD_TYPE=Release
          cache-from: type=gha,version=2,scope=agent-${{ matrix.architecture }}
          cache-to: type=gha,version=2,scope=agent-${{ matrix.architecture }},mode=max,ignore-error=true
      - name: 建置執行映像
        uses: docker/build-push-action@v7
        with:
          context: release-source
          target: taiphoon-runtime
          load: true
          tags: taiphoon-agent:${{ env.VERSION }}-runtime-${{ matrix.architecture }}
          build-args: *agent-build-args
          cache-from: type=gha,version=2,scope=agent-${{ matrix.architecture }}
          cache-to: type=gha,version=2,scope=agent-${{ matrix.architecture }},mode=max,ignore-error=true
      - name: 容器內 workspace 與啟動工具測試
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          chmod a+w output
          docker run --rm --entrypoint /bin/bash \
            --mount "type=bind,source=$PWD/output,target=/output" \
            -e RELEASE_VERSION="$VERSION" \
            "taiphoon-agent:${VERSION}-dev-${ARCHITECTURE}" -c '
              # ROS2 Humble 的 setup.bash 會讀取未設定變數，不能啟用 nounset。
              set -eo pipefail
              trap '\''cp -r /home/taiphoon/Taiphoon_Agent/log /output/ros-logs'\'' EXIT
              source /opt/ros/humble/setup.bash
              source /home/taiphoon/px4_ros_uxrce_dds_ws/install/setup.bash
              cd /home/taiphoon/Taiphoon_Agent
              colcon build --executor sequential --packages-select taiphoon_agent
              colcon test --packages-select taiphoon_agent
              colcon test-result --verbose
              source install/setup.bash
              ROS_DOMAIN_ID=77 ROS_LOCALHOST_ONLY=1 RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
                CYCLONEDDS_URI='' \
                TAIPHOON_PLANNER_EXECUTABLE="$PWD/install/taiphoon_agent/lib/taiphoon_agent/ego_swarm_planner" \
                TAIPHOON_TEST_LOG_DIR=/output \
                python3 test/landing_planner_integration_test.py
              python3 test/small_field_monitor_test.py
              cmake -S Tools/agent_launcher -B /tmp/launcher -DBUILD_TESTING=ON \
                -DCMAKE_BUILD_TYPE=Release -DTAIPHOON_RELEASE_VERSION="$RELEASE_VERSION"
              cmake --build /tmp/launcher --parallel 2
              ctest --test-dir /tmp/launcher --output-on-failure
              bash -n docker/runtime-entrypoint.sh docker/runtime-healthcheck.sh
              sh -n docker/sitl-entrypoint.sh
              cp /tmp/launcher/taiphoon_agent /output/taiphoon_agent
            '
      - name: runtime 無飛控啟動與健康檢查
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name runtime-check "taiphoon-agent:${VERSION}-runtime-${ARCHITECTURE}"
          for attempt in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' runtime-check)
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then docker logs runtime-check; exit 1; fi
            sleep 2
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' runtime-check)" != healthy ]; then
            docker logs runtime-check
            exit 1
          fi
          docker exec runtime-check bash -c '
            source /opt/ros/humble/setup.bash
            source /home/taiphoon/px4_ros_uxrce_dds_ws/install/setup.bash
            source /home/taiphoon/Taiphoon_Agent/install/setup.bash
            set +e
            timeout 5 ros2 topic echo /uav_1_agent/state taiphoon_agent/msg/AgentState \
              --no-daemon --once --field px4_state_valid > /tmp/px4-state.txt
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              grep -Eq "False|false" /tmp/px4-state.txt
            elif [ "$result" -ne 124 ]; then
              exit 1
            fi
          '
          docker stop --timeout 20 runtime-check
      - name: 容器內 Release 傳輸 Gate 回歸
        run: |
          docker run --rm --network none --entrypoint python3 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workflow,readonly" \
            "taiphoon-agent:${VERSION}-dev-${ARCHITECTURE}" /workflow/test/release_transfer_test.py
      - name: 真正 CLI 的單組與四組 PX4 模擬
        if: matrix.architecture == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          if ! docker network inspect Taiphoon_Net >/dev/null 2>&1; then
            docker network create Taiphoon_Net
          fi
          compose_plugin=$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')
          docker run --entrypoint /bin/bash \
            --group-add "$(stat -c %g /var/run/docker.sock)" \
            --mount "type=bind,source=$PWD,target=$PWD" --workdir "$PWD" \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount "type=bind,source=$(command -v docker),target=/usr/local/bin/docker,readonly" \
            --mount "type=bind,source=$compose_plugin,target=/usr/local/lib/docker/cli-plugins/docker-compose,readonly" \
            -e "TAIPHOON_SIM_RUNTIME_IMAGE=taiphoon-agent:${VERSION}-runtime-${ARCHITECTURE}" \
            -e "TAIPHOON_SIM_DEV_IMAGE=taiphoon-agent:${VERSION}-dev-${ARCHITECTURE}" \
            "taiphoon-agent:${VERSION}-dev-${ARCHITECTURE}" -c '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /home/taiphoon/px4_ros_uxrce_dds_ws/install/setup.bash
              source /home/taiphoon/Taiphoon_Agent/install/setup.bash
              python3 test/deployment_live_simulation_test.py output/taiphoon_agent
            '
      - name: 匯出映像與內部校驗資訊
        if: ${{ !inputs.verification_only }}
        shell: bash
        run: |
          set -euo pipefail
          for kind in runtime dev; do
            image="taiphoon-agent:${VERSION}-${kind}-${ARCHITECTURE}"
            archive="output/taiphoon-agent-${kind}-linux-${ARCHITECTURE}.tar.gz"
            docker save "$image" | gzip -1 > "$archive"
            if [ "$(stat -c %s "$archive")" -ge 2147483648 ]; then
              echo "映像超過 GitHub Release 單檔限制，禁止發布不完整產物" >&2
              exit 1
            fi
            echo "${kind}_${ARCHITECTURE}_sha256=$(sha256sum "$archive" | cut -d ' ' -f1)" >> output/images.manifest
            echo "${kind}_${ARCHITECTURE}_id=$(docker image inspect --format '{{.Id}}' "$image")" \
              >> output/images.manifest
            # containerd 的 .Id 是 manifest/index digest；不能跨儲存方式比對 config digest。
            echo "${kind}_${ARCHITECTURE}_layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "$image")" \
              >> output/images.manifest
          done
      - name: 將 Linux 建置檔案送至 Release 草稿
        if: ${{ !inputs.verification_only }}
        run: python3 ../Tools/agent_launcher/release_transfer.py upload "$VERSION" "linux-$ARCHITECTURE" output

      - name: 保留失敗診斷
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          docker ps -a > diagnostics/containers.txt
          docker logs runtime-check > diagnostics/runtime.log 2>&1 || true
          if [ -d output/ros-logs ]; then cp -r output/ros-logs diagnostics/; fi
          cat diagnostics/containers.txt diagnostics/runtime.log
          if [ -f output/ros-logs/latest_test/taiphoon_agent/stdout_stderr.log ]; then
            tail -n 200 output/ros-logs/latest_test/taiphoon_agent/stdout_stderr.log
          fi

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2022
          - platform: macos-universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: release-source
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          path: release-source
      - name: 建置 Windows 原生入口
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          cmake -S Tools/agent_launcher -B build/launcher -A x64 -DBUILD_TESTING=OFF `
            "-DTAIPHOON_RELEASE_VERSION=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/launcher --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory output | Out-Null
          Copy-Item build/launcher/Release/taiphoon_agent.exe output/
      - name: 建置 macOS Intel／Apple Silicon 共用入口
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          cmake -S Tools/agent_launcher -B build/launcher -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DTAIPHOON_RELEASE_VERSION="$VERSION"
          cmake --build build/launcher --parallel 2
          mkdir -p output
          cp build/launcher/taiphoon_agent output/
      - name: 將原生入口送至 Release 草稿
        if: ${{ !inputs.verification_only }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python ../Tools/agent_launcher/release_transfer.py upload "$VERSION" "native-$PLATFORM" output
          else
            python3 ../Tools/agent_launcher/release_transfer.py upload "$VERSION" "native-$PLATFORM" output
          fi

  package:
    if: ${{ !inputs.verification_only }}
    needs: [version, linux, native]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.value }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
    defaults:
      run:
        working-directory: release-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          path: release-source
      - name: 從草稿下載已驗證的建置檔案
        run: python3 ../Tools/agent_launcher/release_transfer.py download "$VERSION" artifacts
      - name: 組裝各平台下載包；校驗資訊內含於工具包
        shell: bash
        run: |
          python3 Tools/agent_launcher/package_release.py
      - name: 上傳五個完整平台包至草稿
        run: python3 ../Tools/agent_launcher/release_transfer.py packages "$VERSION" release
