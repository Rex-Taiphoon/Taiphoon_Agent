# Taiphoon_Agent 障礙物 PointCloud2 模擬設定
# 舊障礙物場景 frame_id 保留為 swarm_ned：x=North、y=East、z=Down。
# 其 origin 由 obstacle_cloud_simulator 的 swarm_origin_agent_index 指定，
# 不代表所有 Agent 的 planner 共用同一個 NED origin。
# 目前此檔案是純資料契約，未引入 yaml-cpp；未來 ROS2 Node 可映射為
# taiphoon::perception::GenerationConfig 與 std::vector<ObstacleDefinition>。

frame_id: swarm_ned
mode: synthetic_sensor
sample_spacing_m: 0.5
publish_rate_hz: 15.0
random_seed: 20260810

sensor:
  range_m: 20.0
  horizontal_fov_deg: 270.0
  vertical_fov_deg: 90.0
  noise_std_m: 0.02
  dropout_ratio: 0.05

obstacles:
  - type: box
    center_ned: [12.0, 0.0, -3.0]
    size_m: [4.0, 8.0, 6.0]

  - type: cylinder
    center_ned: [22.0, 5.0, -3.0]
    radius_m: 2.0
    height_m: 6.0

  - type: wall
    center_ned: [32.0, 0.0, -3.0]
    size_m: [0.5, 20.0, 6.0]
